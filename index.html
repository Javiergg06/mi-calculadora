<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mi Calculadora" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%234f46e5' width='180' height='180'/><text x='90' y='100' font-size='80' fill='white' text-anchor='middle' dominant-baseline='middle'>🧮</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <title>Mi Calculadora de Gastos</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Configuración rápida de Tailwind
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#4f46e5',
            brandDark: '#4338ca',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body class="bg-slate-100 font-sans text-slate-800 antialiased">

  <!-- Contenedor principal tipo "móvil" -->
  <div class="mx-auto flex min-h-screen w-full max-w-md flex-col bg-slate-50 shadow-xl">

    <!-- ===================================================== -->
    <!-- PÁGINA 1: PANTALLA PRINCIPAL (Ingreso y Calculadora)  -->
    <!-- ===================================================== -->
    <section id="page-home" class="page flex flex-1 flex-col">

      <!-- Encabezado -->
      <header class="bg-gradient-to-br from-brand to-brandDark px-6 pb-8 pt-10 text-white shadow-lg">
        <h1 class="text-2xl font-extrabold tracking-tight">Bienvenido a tu calculadora 👋</h1>
        <p class="mt-1 text-sm text-indigo-100">Controla tus gastos en segundos</p>

        <!-- Bloque de dinero disponible -->
        <div class="mt-6 rounded-2xl bg-white/15 p-4 backdrop-blur">
          <label for="input-balance" class="text-xs font-medium uppercase tracking-wide text-indigo-100">
            Dinero disponible
          </label>
          <div class="mt-1 flex items-center gap-2">
            <span class="text-3xl font-bold">€</span>
            <input
              id="input-balance"
              type="number"
              inputmode="decimal"
              step="0.01"
              placeholder="0.00"
              class="w-full bg-transparent text-4xl font-extrabold text-white placeholder-indigo-200 outline-none"
            />
          </div>
          <p class="mt-1 text-xs text-indigo-100">Edita este valor cuando ingreses dinero.</p>
        </div>
      </header>

      <!-- Cuerpo: nuevo gasto -->
      <main class="flex flex-1 flex-col gap-5 px-6 py-6">

        <!-- Importe del gasto -->
        <div class="rounded-2xl bg-white p-5 shadow-sm">
          <label for="input-amount" class="block text-center text-base font-semibold text-slate-700">
            ¿Cuánto dinero nos hemos gastado?
          </label>
          <div class="mt-3 flex items-center justify-center gap-2">
            <span class="text-3xl font-bold text-slate-400">€</span>
            <input
              id="input-amount"
              type="number"
              inputmode="decimal"
              step="0.01"
              min="0"
              placeholder="0.00"
              class="w-full max-w-[220px] rounded-xl bg-slate-100 py-3 text-center text-5xl font-extrabold text-slate-800 placeholder-slate-300 outline-none focus:ring-2 focus:ring-brand"
            />
          </div>
        </div>

        <!-- Categoría -->
        <div class="rounded-2xl bg-white p-5 shadow-sm">
          <label for="input-category" class="block text-sm font-semibold text-slate-700">
            ¿En qué te lo has gastado?
          </label>
          <input
            id="input-category"
            type="text"
            enterkeyhint="done"
            autocomplete="off"
            placeholder="Ej: Chuches, Fútbol, Boxeo, Material DAW…"
            class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-lg outline-none focus:border-brand focus:ring-2 focus:ring-brand"
          />
        </div>

        <!-- Botón registrar -->
        <button
          id="btn-register"
          class="w-full rounded-2xl bg-brand py-4 text-lg font-bold text-white shadow-lg shadow-indigo-200 transition active:scale-[0.98] active:bg-brandDark"
        >
          ➕ Registrar Gasto
        </button>

        <!-- Mensaje de feedback -->
        <p id="feedback-msg" class="hidden text-center text-sm font-medium"></p>
      </main>

      <!-- Navegación inferior -->
      <footer class="sticky bottom-0 border-t border-slate-200 bg-slate-50/90 p-4 backdrop-blur">
        <button
          id="btn-go-expenses"
          class="flex w-full items-center justify-center gap-2 rounded-2xl bg-slate-800 py-4 text-lg font-bold text-white shadow-lg transition active:scale-[0.98]"
        >
          📋 Ver todos mis gastos
        </button>
      </footer>
    </section>

    <!-- ===================================================== -->
    <!-- PÁGINA 2: HISTORIAL Y ASISTENTE IA                    -->
    <!-- ===================================================== -->
    <section id="page-expenses" class="page hidden flex-1 flex-col">

      <!-- Encabezado -->
      <header class="sticky top-0 z-10 flex items-center gap-3 bg-white px-5 py-4 shadow-sm">
        <button id="btn-back" class="rounded-full p-2 text-slate-600 transition active:bg-slate-100" aria-label="Volver">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <div>
          <h2 class="text-xl font-extrabold tracking-tight">Mis gastos</h2>
          <p class="text-xs text-slate-500">Historial completo</p>
        </div>
      </header>

      <!-- Resumen -->
      <div class="grid grid-cols-2 gap-3 px-5 py-4">
        <div class="rounded-2xl bg-white p-4 shadow-sm">
          <p class="text-xs font-medium uppercase text-slate-400">Disponible</p>
          <p id="summary-balance" class="mt-1 text-2xl font-extrabold text-emerald-600">€0.00</p>
        </div>
        <div class="rounded-2xl bg-white p-4 shadow-sm">
          <p class="text-xs font-medium uppercase text-slate-400">Total gastado</p>
          <p id="summary-spent" class="mt-1 text-2xl font-extrabold text-rose-600">€0.00</p>
        </div>
      </div>

      <!-- Lista de gastos -->
      <main class="flex-1 px-5 pb-4">
        <div class="mb-2 flex items-center justify-between">
          <h3 class="text-sm font-semibold uppercase tracking-wide text-slate-500">Movimientos</h3>
          <button id="btn-clear" class="text-xs font-medium text-rose-500 active:underline">Borrar todo</button>
        </div>

        <ul id="expense-list" class="flex flex-col gap-2">
          <!-- Los gastos se inyectan aquí desde JS -->
        </ul>

        <!-- Estado vacío -->
        <div id="empty-state" class="mt-10 flex flex-col items-center text-center text-slate-400">
          <span class="text-5xl">🧾</span>
          <p class="mt-2 text-sm">Aún no has registrado ningún gasto.</p>
        </div>
      </main>

      <!-- Navegación inferior -->
      <footer class="sticky bottom-0 border-t border-slate-200 bg-slate-50/90 p-4 backdrop-blur">
        <button
          id="btn-go-home"
          class="flex w-full items-center justify-center gap-2 rounded-2xl bg-brand py-4 text-lg font-bold text-white shadow-lg transition active:scale-[0.98]"
        >
          🧮 Volver a la calculadora
        </button>
      </footer>
    </section>

  </div>

  <!-- Lógica de la app -->
  <script src="app.js"></script>
</body>
</html>
